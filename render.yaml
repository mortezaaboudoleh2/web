services:
  - type: web
    name: hana-love
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
    disk:
      name: hana-data
      mountPath: /var/data
      sizeGB: 1
